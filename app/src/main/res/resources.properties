# The unqualified `values/` folder is written in SERBIAN (Latin script).
#
# Without this line Android does not know that, and a phone set to sr-Latn-RS
# finds no match for it: the qualifier `sr` is read as Cyrillic Serbian, and the
# default folder claims no language at all. Resolution then moves on to the next
# locale in the user's list — usually en-US — and lands in `values-en`. The app
# came up in English on a Serbian phone for exactly that reason (found on device
# 14.08.2026, after a clean install ruled out a restored setting).
#
# AGP feeds this to `generateLocaleConfig`, which also gives Android the list for
# the per-app language picker in system Settings.
unqualifiedResLocale=sr-Latn
